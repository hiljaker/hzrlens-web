openapi: 3.0.3
info:
  title: HZR Lens API
  version: 0.4.0
  description: Persistent simulation, overview, replayable SSE invalidation, curated evidence and Standard Analysis. Optional AI remains planned.
  license:
    name: Proprietary
    url: https://github.com/hiljaker/hzrlens-api
servers:
  - url: /
    description: Same origin as the API deployment
security: []
tags:
  - name: Simulation
    description: Validated scenarios and isolated simulation sessions.
  - name: Investigation
    description: Session-scoped incidents, curated evidence and deterministic Standard Analysis.
  - name: System
    description: Operational liveness and database readiness.
paths:
  /api/v1/simulation-sessions/{sessionId}/overview:
    get:
      operationId: getSessionOverview
      tags: [Simulation]
      summary: Read a consistent session dashboard
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Current generation, service metrics, incidents and five recent deployments. Metrics are per-service; cross-service aggregates are not inferred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionOverview'
        '404':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'
  /api/v1/simulation-sessions/{sessionId}/events:
    get:
      operationId: streamSessionRevisions
      tags: [Simulation]
      summary: Subscribe to committed session revisions
      description: 'session.updated invalidates all session REST snapshots. IDs are sessionId:sequence. Retains 512 revisions across resets; unknown, future or expired cursors emit stream.resync_required then close. Clients refetch and reconnect without the cursor. Heartbeat every 15 seconds; connections rotate after five minutes. At most three connections/session and 100/process.'
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - in: header
          name: Last-Event-ID
          schema:
            type: string
            pattern: '^[a-f0-9]{32}:[1-9][0-9]*$'
      responses:
        '200':
          description: SSE session.updated JSON uses SessionRevision; stream.heartbeat and stream.resync_required carry an empty object and no ID.
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/RequestError'
        '404':
          $ref: '#/components/responses/RequestError'
        '429':
          $ref: '#/components/responses/RequestError'
        '503':
          $ref: '#/components/responses/RequestError'
  /healthz:
    get:
      operationId: getLiveness
      tags: [System]
      summary: Check whether the process is responding
      responses:
        "200":
          description: Process is live. Database availability is checked separately.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
        "400":
          $ref: "#/components/responses/RequestError"
        "403":
          $ref: "#/components/responses/RequestError"
        "500":
          $ref: "#/components/responses/RequestError"
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      summary: Check PostgreSQL connectivity and initial schema availability
      responses:
        "200":
          description: Database and initial schema are available. No product feature readiness is implied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadySystem"
        "503":
          description: Database or initial schema unavailable. Contains no connection details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableSystem"
        "400":
          $ref: "#/components/responses/RequestError"
        "403":
          $ref: "#/components/responses/RequestError"
        "500":
          $ref: "#/components/responses/RequestError"
  /api/v1/scenarios:
    {
      "get":
        {
          "operationId": "listScenarios",
          "tags": ["Simulation"],
          "summary": "List validated scenarios",
          "responses":
            {
              "200":
                {
                  "description": "Committed resource snapshot.",
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            {
                              "type": "object",
                              "additionalProperties": false,
                              "required": ["items"],
                              "properties":
                                {
                                  "items":
                                    {
                                      "type": "array",
                                      "items":
                                        {
                                          "$ref": "#/components/schemas/ScenarioSummary",
                                        },
                                    },
                                },
                            },
                        },
                    },
                },
              "400": { "$ref": "#/components/responses/RequestError" },
              "403": { "$ref": "#/components/responses/RequestError" },
              "404": { "$ref": "#/components/responses/RequestError" },
              "409": { "$ref": "#/components/responses/RequestError" },
              "413": { "$ref": "#/components/responses/RequestError" },
              "429": { "$ref": "#/components/responses/RequestError" },
              "500": { "$ref": "#/components/responses/RequestError" },
