          [
            "id",
            "version",
            "title",
            "description",
            "durationSeconds",
            "defaultSeed",
          ],
        "properties":
          {
            "id": { "type": "string", "maxLength": 64 },
            "version":
              { "type": "integer", "minimum": 1, "maximum": 2147483647 },
            "title": { "type": "string" },
            "description": { "type": "string" },
            "durationSeconds":
              { "type": "integer", "minimum": 1, "maximum": 600 },
            "defaultSeed":
              { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          },
      }
    ScenarioService:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          ["id", "displayName", "type", "criticality", "initialStatus"],
        "properties":
          {
            "id": { "type": "string" },
            "displayName": { "type": "string" },
            "type":
              {
                "type": "string",
                "enum": ["api", "worker", "database", "external"],
              },
            "criticality":
              { "type": "string", "enum": ["low", "medium", "high"] },
            "initialStatus":
              {
                "type": "string",
                "enum": ["healthy", "degraded", "unavailable"],
              },
            "initialVersion": { "type": "string" },
          },
      }
    ScenarioDependency:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["sourceServiceId", "targetServiceId", "relationship"],
        "properties":
          {
            "sourceServiceId": { "type": "string" },
            "targetServiceId": { "type": "string" },
            "relationship":
              {
                "type": "string",
                "enum":
                  [
                    "calls",
                    "reads_from",
                    "writes_to",
                    "publishes_to",
                    "consumes_from",
                  ],
              },
          },
      }
    Session:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "scenarioId",
            "scenarioVersion",
            "seed",
            "generation",
            "status",
            "simulationTimeMs",
            "createdAt",
            "expiresAt",
          ],
        "properties":
          {
            "id": { "type": "string", "pattern": "^[a-f0-9]{32}$" },
            "scenarioId": { "type": "string" },
            "scenarioVersion":
              { "type": "integer", "minimum": 1, "maximum": 2147483647 },
            "seed":
              { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
            "generation":
              { "type": "integer", "minimum": 1, "maximum": 2147483647 },
            "status":
              {
                "type": "string",
                "enum": ["idle", "running", "paused", "completed"],
              },
            "simulationTimeMs":
              { "type": "integer", "minimum": 0, "maximum": 600000 },
            "createdAt": { "type": "string", "format": "date-time" },
            "startedAt": { "type": "string", "format": "date-time" },
            "completedAt": { "type": "string", "format": "date-time" },
            "expiresAt": { "type": "string", "format": "date-time" },
          },
      }
    CreateSession:
      {
        "type": "object",
        "additionalProperties": false,
        "required": ["scenarioId"],
        "properties":
          {
            "scenarioId": { "type": "string", "minLength": 1, "maxLength": 64 },
            "scenarioVersion":
              { "type": "integer", "minimum": 1, "maximum": 2147483647 },
            "seed":
              { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          },
      }
    SessionCommand:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [],
        "properties":
          {
            "seed":
              { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
          },
      }
    ScenarioDetail:
      {
        "type": "object",
        "additionalProperties": false,
        "required":
          [
            "id",
            "version",
            "title",
            "description",
            "durationSeconds",
            "defaultSeed",
            "services",
            "dependencies",
            "speedMultiplier",
          ],
        "properties":
          {
            "id": { "type": "string", "maxLength": 64 },
            "version":
              { "type": "integer", "minimum": 1, "maximum": 2147483647 },
            "title": { "type": "string" },
            "description": { "type": "string" },
            "durationSeconds":
              { "type": "integer", "minimum": 1, "maximum": 600 },
            "defaultSeed":
              { "type": "integer", "minimum": 0, "maximum": 9007199254740991 },
            "services":
              {
                "type": "array",
                "maxItems": 5,
                "items": { "$ref": "#/components/schemas/ScenarioService" },
              },
            "dependencies":
              {
                "type": "array",
                "items": { "$ref": "#/components/schemas/ScenarioDependency" },
              },
            "speedMultiplier":
              { "type": "integer", "minimum": 1, "maximum": 20 },
          },
      }
    IncidentStatus:
      type: string
      enum: [active, recovering, resolved]
    IncidentTrigger:
      type: object
      additionalProperties: false
      required: [ruleId, metric, observedValue, threshold, explanation]
      properties:
        ruleId: { type: string, minLength: 1, maxLength: 128 }
        metric: { type: string, minLength: 1, maxLength: 128 }
        observedValue: { type: number }
        threshold: { type: number }
        explanation: { type: string, minLength: 1, maxLength: 1000 }
    Incident:
      type: object
      additionalProperties: false
      required: [id, sessionId, generation, title, severity, status, startedAt, detectedAt, primaryServiceId, affectedServiceIds, trigger]
      properties:
        id: { type: string, pattern: "^[a-f0-9]{32}$" }
        sessionId: { type: string, pattern: "^[a-f0-9]{32}$" }
        generation: { type: integer, minimum: 1, maximum: 2147483647 }
        title: { type: string, minLength: 1, maxLength: 200 }
        severity: { type: string, enum: [P1, P2, P3, P4] }
        status: { $ref: "#/components/schemas/IncidentStatus" }
        startedAt: { type: string, format: date-time }
        detectedAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
        primaryServiceId: { type: string, minLength: 1 }
        affectedServiceIds:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items: { type: string }
        trigger: { $ref: "#/components/schemas/IncidentTrigger" }
    LogPayload:
      type: object
      additionalProperties: false
      required: [severity, message]
      properties:
        severity: { type: string, enum: [debug, info, warning, error, critical] }
        message: { type: string }
    MetricPayload:
      type: object
      additionalProperties: false
      required: [metric, value, unit]
      properties:
        metric: { type: string }
        value: { type: number }
        unit: { type: string }
    DeploymentPayload:
      type: object
      additionalProperties: false
      required: [version, status]
      properties:
        version: { type: string }
        previousVersion: { type: string }
        status: { type: string, enum: [started, completed, failed] }
    ErrorPayload:
      type: object
      additionalProperties: false
      required: [severity, message]
      properties:
        severity: { type: string, enum: [debug, info, warning, error, critical] }
        code: { type: string }
        message: { type: string }
    StatePayload:
      type: object
      additionalProperties: false
      required: [previousStatus, currentStatus]
      properties:
        previousStatus: { type: string, enum: [healthy, degraded, unavailable] }
        currentStatus: { type: string, enum: [healthy, degraded, unavailable] }
    JobPayload:
      type: object
      additionalProperties: false
      required: [jobName, reason]
      properties:
        jobName: { type: string }
        reason: { type: string }
    TelemetryEvent:
      oneOf:
        - $ref: "#/components/schemas/LogTelemetryEvent"
        - $ref: "#/components/schemas/MetricTelemetryEvent"
        - $ref: "#/components/schemas/DeploymentTelemetryEvent"
        - $ref: "#/components/schemas/ErrorTelemetryEvent"
        - $ref: "#/components/schemas/StateTelemetryEvent"
        - $ref: "#/components/schemas/JobTelemetryEvent"
      discriminator:
        propertyName: kind
        mapping:
          log: "#/components/schemas/LogTelemetryEvent"
          metric: "#/components/schemas/MetricTelemetryEvent"
          deployment: "#/components/schemas/DeploymentTelemetryEvent"
          error: "#/components/schemas/ErrorTelemetryEvent"
          service_state: "#/components/schemas/StateTelemetryEvent"
          job_failure: "#/components/schemas/JobTelemetryEvent"
    TelemetryEventBase:
      type: object
      required: [id, sessionId, generation, sequence, timestamp, environment, offsetMs, serviceId]
      properties:
        id: { type: string, pattern: "^[a-f0-9]{32}$" }
        sessionId: { type: string, pattern: "^[a-f0-9]{32}$" }
        generation: { type: integer, minimum: 1 }
        sequence: { type: integer, minimum: 1 }
        timestamp: { type: string, format: date-time }
        environment: { type: string, enum: [simulation] }
        fixtureKey: { type: string }
        offsetMs: { type: integer, minimum: 0, maximum: 600000 }
        serviceId: { type: string }
    LogTelemetryEvent:
      allOf:
        - $ref: "#/components/schemas/TelemetryEventBase"
        - type: object
          required: [kind, payload]
          properties:
            kind: { type: string, enum: [log] }
            payload: { $ref: "#/components/schemas/LogPayload" }
    MetricTelemetryEvent:
      allOf:
        - $ref: "#/components/schemas/TelemetryEventBase"
        - type: object
          required: [kind, payload]
          properties:
            kind: { type: string, enum: [metric] }
            payload: { $ref: "#/components/schemas/MetricPayload" }
    DeploymentTelemetryEvent:
      allOf:
        - $ref: "#/components/schemas/TelemetryEventBase"
        - type: object
          required: [kind, payload]
          properties:
            kind: { type: string, enum: [deployment] }
            payload: { $ref: "#/components/schemas/DeploymentPayload" }
    ErrorTelemetryEvent:
      allOf:
        - $ref: "#/components/schemas/TelemetryEventBase"
        - type: object
          required: [kind, payload]
          properties:
            kind: { type: string, enum: [error] }
            payload: { $ref: "#/components/schemas/ErrorPayload" }
    StateTelemetryEvent:
      allOf:
        - $ref: "#/components/schemas/TelemetryEventBase"
        - type: object
          required: [kind, payload]
          properties:
            kind: { type: string, enum: [service_state] }
            payload: { $ref: "#/components/schemas/StatePayload" }
    JobTelemetryEvent:
      allOf:
        - $ref: "#/components/schemas/TelemetryEventBase"
        - type: object
          required: [kind, payload]
          properties:
            kind: { type: string, enum: [job_failure] }
            payload: { $ref: "#/components/schemas/JobPayload" }
    CorrelationScore:
      type: object
      additionalProperties: false
      required: [temporalScore, serviceScore, dependencyScore, anomalyScore, eventTypeScore, precedenceScore, totalScore]
      properties:
        temporalScore: { type: number, minimum: 0, maximum: 1 }
        serviceScore: { type: number, minimum: 0, maximum: 1 }
        dependencyScore: { type: number, minimum: 0, maximum: 1 }
        anomalyScore: { type: number, minimum: 0, maximum: 1 }
        eventTypeScore: { type: number, minimum: 0, maximum: 1 }
        precedenceScore: { type: number, minimum: 0, maximum: 1 }
        totalScore: { type: number, minimum: 0, maximum: 1 }
    CorrelationReason:
      type: object
      additionalProperties: false
      required: [type, description, contribution]
      properties:
        type: { type: string }
        description: { type: string }
        contribution: { type: number, minimum: 0, maximum: 1 }
    Evidence:
      type: object
      additionalProperties: false
      required: [id, incidentId, sourceEvent, rank, title, description, correlation, reasons, scoringVersion]
      properties:
        id: { type: string, pattern: "^[a-f0-9]{32}$" }
        incidentId: { type: string, pattern: "^[a-f0-9]{32}$" }
        sourceEvent: { $ref: "#/components/schemas/TelemetryEvent" }
        rank: { type: integer, minimum: 1, maximum: 10 }
        title: { type: string }
        description: { type: string }
        correlation: { $ref: "#/components/schemas/CorrelationScore" }
        reasons:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: "#/components/schemas/CorrelationReason" }
        scoringVersion: { type: string }
    TimelineEntry:
      type: object
      additionalProperties: false
      required: [eventId, simulationOffsetMs, title, description]
      properties:
        eventId: { type: string, pattern: "^[a-f0-9]{32}$" }
        simulationOffsetMs: { type: integer, minimum: 0, maximum: 600000 }
        title: { type: string }
        description: { type: string }
    MetricSummary:
      type: object
      additionalProperties: false
      required: [serviceId, metric, unit, minimum, maximum, latest]
      properties:
        serviceId: { type: string }
        metric: { type: string }
        unit: { type: string }
        minimum: { type: number }
        maximum: { type: number }
        latest: { type: number }
    InvestigationContext:
      type: object
      additionalProperties: false
      required: [schemaVersion, incident, services, dependencies, metricSummaries, timeline, evidence]
      properties:
        schemaVersion: { type: string, enum: ["1"] }
        incident: { $ref: "#/components/schemas/Incident" }
        services:
          type: array
          minItems: 1
          maxItems: 5
          items: { $ref: "#/components/schemas/ScenarioService" }
        dependencies:
          type: array
          items: { $ref: "#/components/schemas/ScenarioDependency" }
        metricSummaries:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/MetricSummary" }
        timeline:
          type: array
          maxItems: 10
          items: { $ref: "#/components/schemas/TimelineEntry" }
        evidence:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/Evidence" }
    EvidenceRelationship:
      type: object
      additionalProperties: false
      required: [evidenceId, relationship]
      properties:
        evidenceId: { type: string, pattern: "^[a-f0-9]{32}$" }
        relationship: { type: string, enum: [supporting, contradictory] }
    Hypothesis:
      type: object
      additionalProperties: false
      required: [id, title, summary, evidenceScore, evidence]
      properties:
        id: { type: string }
        title: { type: string }
        summary: { type: string }
        evidenceScore: { type: number, minimum: 0, maximum: 1 }
        evidence:
          type: array
          items: { $ref: "#/components/schemas/EvidenceRelationship" }
    Recommendation:
      type: object
      additionalProperties: false
      required: [id, title, rationale, priority]
      properties:
        id: { type: string }
        hypothesisId: { type: string }
        title: { type: string }
        rationale: { type: string }
        priority: { type: string, enum: [now, next, later] }
    AnalysisResult:
      type: object
      additionalProperties: false
      required: [id, incidentId, contextSchemaVersion, engineVersion, mode, summary, hypotheses, recommendedActions, warnings, createdAt]
      properties:
        id: { type: string, pattern: "^[a-f0-9]{32}$" }
        incidentId: { type: string, pattern: "^[a-f0-9]{32}$" }
        contextSchemaVersion: { type: string, enum: ["1"] }
        engineVersion: { type: string }
        mode: { type: string, enum: [standard] }
        summary: { type: string }
        hypotheses:
          type: array
          items: { $ref: "#/components/schemas/Hypothesis" }
        recommendedActions:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        warnings:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    SystemStatus:
      oneOf:
        - $ref: "#/components/schemas/ReadySystem"
        - $ref: "#/components/schemas/UnavailableSystem"
      discriminator:
        propertyName: status
        mapping:
          ready: "#/components/schemas/ReadySystem"
          unavailable: "#/components/schemas/UnavailableSystem"
    ReadySystem:
      type: object
      additionalProperties: false
      required: [status, database, environment, advancedAiEnabled]
      properties:
        status:
          type: string
          enum: [ready]
        database:
          type: string
          enum: [ready]
        environment:
          type: string
          enum: [simulation]
        advancedAiEnabled:
          type: boolean
          enum: [false]
    UnavailableSystem:
      type: object
      additionalProperties: false
      required: [status, database, environment, advancedAiEnabled]
      properties:
        status:
          type: string
          enum: [unavailable]
        database:
          type: string
          enum: [unavailable]
        environment:
          type: string
          enum: [simulation]
        advancedAiEnabled:
          type: boolean
          enum: [false]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum:
                [
                  INVALID_REQUEST,
                  NOT_FOUND,
                  ORIGIN_NOT_ALLOWED,
                  INTERNAL_ERROR,
                  SCENARIO_NOT_FOUND,
                  SESSION_NOT_FOUND,
                  INCIDENT_NOT_FOUND,
                  INVALID_SEED,
                  INVALID_SESSION_STATE,
                  STALE_SESSION_GENERATION,
                  IDEMPOTENCY_CONFLICT,
                  RATE_LIMITED,
                  SESSION_LIMIT_REACHED,
                  DEPENDENCY_UNAVAILABLE,
                ]
            message:
              type: string
              maxLength: 256
            requestId:
              type: string
              pattern: "^[a-f0-9]{32}$"
