        "404": { "$ref": "#/components/responses/RequestError" }
        "503": { "$ref": "#/components/responses/RequestError" }
components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
  responses:
    RequestError:
      description: Safe request error. The server generates a fresh X-Request-Id and never reflects request metadata.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    SessionRevision:
      type: object
      additionalProperties: false
      required: [schemaVersion, sessionId, generation, sequence, simulationTimeMs, occurredAt]
      properties:
        schemaVersion: { type: string, enum: ['1'] }
        sessionId: { type: string, pattern: '^[a-f0-9]{32}$' }
        generation: { type: integer, minimum: 1 }
        sequence: { type: integer, minimum: 1, maximum: 9007199254740991 }
        simulationTimeMs: { type: integer, minimum: 0 }
        occurredAt: { type: string, format: date-time }
    SessionOverview:
      type: object
      additionalProperties: false
      required: [sessionId, generation, status, simulationTimeMs, services, incidents, deployments]
      properties:
        sessionId: { type: string, pattern: '^[a-f0-9]{32}$' }
        generation: { type: integer, minimum: 1 }
        status: { type: string, enum: [idle, running, paused, completed] }
        simulationTimeMs: { type: integer, minimum: 0 }
        services:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, displayName, status, metrics]
            properties:
              id: { type: string }
              displayName: { type: string }
              status: { type: string, enum: [healthy, degraded, unavailable] }
              metrics:
                type: array
                items: { $ref: '#/components/schemas/MetricPayload' }
        incidents:
          type: array
          items: { $ref: '#/components/schemas/Incident' }
        deployments:
          type: array
          maxItems: 5
          items:
            type: object
            additionalProperties: false
            required: [serviceId, simulationTimeMs, version, status]
            properties:
              serviceId: { type: string }
              simulationTimeMs: { type: integer, minimum: 0 }
              version: { type: string }
              status: { type: string }
    ScenarioSummary:
      {
        "type": "object",
