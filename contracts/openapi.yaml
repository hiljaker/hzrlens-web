    get:
      operationId: getStandardAnalysis
      tags: [Investigation]
      summary: Get deterministic evidence-led analysis
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IncidentId"
      responses:
